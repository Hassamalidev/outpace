# Local development services. Start with: docker compose up -d
# Host ports can be overridden with FORGE_POSTGRES_PORT / FORGE_REDIS_PORT in .env.
services:
  postgres:
    # pgvector image: the Prisma schema enables the `vector` extension.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - '${FORGE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forge -d forge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '${FORGE_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
